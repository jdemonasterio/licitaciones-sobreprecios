# Configuración general. Se relee en cada corrida: editar y volver a correr.

db_path: data/sobreprecios.db
cache_dir: data/cache

llm:
  # Todo lo que se procesa es información pública: el plan GRATIS de los proveedores
  # alcanza (más lento, con cuotas). Override por corrida: LIC_LLM_PERFIL=pago
  perfil: gratis
  perfiles:
    gratis:
      # Alias "latest" de Google: siguen al Flash vigente aunque Google deprecie versiones.
      roles:
        cheap: gemini-flash-lite-latest   # clasificar renglones, machear productos
        pdf: gemini-flash-latest          # leer PDFs de actas / anexos
      # Pedidos por minuto (por debajo del límite del plan gratis, para no comer 429).
      rpm:
        gemini-flash-lite-latest: 10
        gemini-flash-latest: 5
      # Ante "429 demasiados pedidos": esperar y reintentar con paciencia.
      reintentos: 8
      espera_maxima_s: 300
    pago:
      roles:
        cheap: gpt-6-luna          # ~USD 0.001 por aviso
        pdf: gemini-3.6-flash
      reintentos: 3
      espera_maxima_s: 60
  # Alternativa gratis de respaldo: un modelo ':free' de OpenRouter, por ejemplo
  #   LIC_LLM_ROLE_CHEAP=openrouter/<modelo>:free   (requiere OPENROUTER_API_KEY)
  # Corte duro de gasto por corrida (USD), solo perfil pago. Al llegar, sigue con reglas.
  max_usd_por_corrida: 2.0

comparacion:
  # Observaciones de mercado a <= N días de la fecha de la compra se usan tal cual.
  ventana_directa_dias: 15
  # Más lejos que esto no se compara (ni ajustando por IPC).
  gap_maximo_dias: 120
  # Hueco sin datos anteriores (ene-jul 2024): se infiere hacia atrás desde lo primero que aparece después, hasta
  # N días, con el IPC. Rotulado "inferido", confianza baja, nunca rojo (MEJORAS #46).
  gap_inferencia_dias: 240
  # Un envase de mercado entra si su contenido está entre tamaño/banda y tamaño*banda
  # (los bultos grandes son más baratos por kg; los chicos, más caros).
  banda_tamano: 2.5
  # Outliers por canal respecto de la mediana (promos, productos mal macheados).
  outlier_bajo: 0.4
  outlier_alto: 2.5
  # Plazo de pago típico del Estado. Con inflación mensual m, se descuenta m*plazo
  # del sobreprecio ("costo financiero", Grupo Quijote §8).
  plazo_pago_meses: 1.0
  # Contra qué se calcula el semáforo y el exceso en $ (jdemonasterio 2026-10-11):
  #   1. si la licitación nombra la MARCA y está en el mercado -> esa marca;
  #   2. si no, el MÍNIMO de mercado normalizado por kg/l/u, sin importar la marca;
  #      si la licitación dice el envase ("envases de 1 kg") se usa solo ese envase.
  # Opciones: min_mayorista (default) | p25_mayorista | mediana_mayorista |
  #           min_minorista | mediana_minorista | indec
  # Ojo: con "mínimo", un precio mal cargado en la fuente se vuelve la referencia. Por eso
  # los outliers (< outlier_bajo x mediana) se descartan antes y el webui muestra de dónde
  # sale el mínimo para verificarlo.
  # Decisión del LLM prime P16 (2026-10-11): mínimo de AMBOS canales (el pool mayorista es delgado y
  # 1-2 observaciones raras escondían sobreprecio). El rojo se mide contra el mínimo CORROBORADO.
  referencia_principal: min_mercado
  # Rojo exige que el mínimo (o la misma marca) esté confirmado por >= N familias de fuentes
  # independientes dentro de ±tolerancia (SEPA y su espejo son UNA familia). Decisión del LLM prime P1.
  rojo_min_fuentes: 2
  # jdemonasterio 2026-10-12 (P1): 5 % — en Argentina hay mucha variabilidad de precios entre cadenas.
  corroboracion_tolerancia: 0.05
  umbral_rojo_pct: 20
  umbral_amarillo_pct: 8
  # Si precio_estado / referencia > N (o < 1/N) casi seguro es un error de unidad
  # (bulto vs unidad, kg vs g): se marca "revisar_unidad", nunca "rojo".
  plausibilidad_max_ratio: 4.0
  # Cuarentena de precios de mercado (pipeline/cuarentena.py): fuera del comparador, no se borran.
  cuarentena_bajo: 0.3            # < 0,3 x mediana del producto en el mes (todas las fuentes)
  cuarentena_alto: 5.0
  cuarentena_precio_minimo: 5.0   # envase a menos de $5: valor de relleno
  # Un envase < factor x tamaño de referencia del producto no es ese producto (condimento, snack, monodosis).
  contenido_minimo_factor: 0.3
  # ── Decisiones del LLM prime P17-P21 (2026-10-11). Cada flag se puede revertir acá.
  # El rojo tiene que sobrevivir con este plazo de pago (factor compuesto); si un plazo plausible
  # cambia la alerta, queda en amarillo.
  plazo_escenarios_rojo_meses: 2
  # Si la compra exige el envase y el mercado no lo tiene en la fecha: gris (no se relaja a la banda).
  presentacion_exigida_estricta: true
  # "Mismo envase" = contenido a ±3% (juez casos 2026-10-11: 4,5 L no es 5 L, 85 g no es 90 g, 350 g no es 380 g).
  tolerancia_presentacion: 0.03
  # Atributo crítico (variante) desconocido o ambiguo en la compra: gris | sin_rojo
  atributo_desconocido: gris
  # Variante exigida sin mercado de esa variante en la fecha: gris | sin_rojo
  variante_sin_mercado: gris
  # Equivalencia no verificada (variedad / composición / envase): gris, o amarillo destacado
  # "equivalencia por verificar" si la brecha contra lo más parecido llega al umbral de rojo (P7).
  equivalencia_no_verificada: amarillo_si_rojo   # amarillo_si_rojo | gris
  # El promedio INDEC como única referencia nunca da rojo (máximo amarillo).
  indec_solo_habilita_rojo: false
  # Hasta cuántos días de antigüedad un precio de mercado trasladado por IPC puede habilitar ROJO
  # (jdemonasterio 2026-10-12, pisa la cautela original "fuera de la ventana, nunca rojo"): default
  # 120 (= gap_maximo_dias, todo lo que ya se usa como referencia puede dar rojo si corrobora con 2
  # fuentes y aguanta el plazo de pago). Poné 15 (= ventana_directa_dias) para volver a la regla
  # estricta: más allá de la ventana directa, nunca rojo, solo contexto. Más allá de este tope sigue
  # siendo "contexto, nunca rojo" en el motivo. No aplica al precio INFERIDO (nunca rojo, sin excepción).
  rojo_con_ajuste_ipc_hasta_dias: 120
  # IPC con fecha de publicación y versión (MEJORAS #30/#45, jdemonasterio 2026-10-12):
  #   retrospectivo (default): usa el IPC definitivo de cada mes, aunque se haya publicado DESPUÉS
  #     de la fecha de la compra (es el valor que tenemos hoy, el más preciso con el diario de hoy).
  #   disponible_a_fecha: el comparador solo usa meses de IPC cuya fecha_publicacion <= la fecha de
  #     la compra ("lo que se sabía a la fecha") — tanto para el ajuste financiero (inflación del
  #     plazo de pago) como para el ajuste temporal de precios de mercado de otro mes.
  ipc_modo: retrospectivo

# Nombre canónico de organismo (MEJORAS #53, jdemonasterio 2026-10-12): el mismo organismo aparece
# con nombres distintos según la fuente (código SAF de COMPR.AR adelante, el título completo del
# Boletín Oficial, o con una subunidad tipo "... Secretaría de Gestión Administrativa") y eso
# partía las cifras en Analítica, los filtros y los rankings. `organismo_canonico` (ver
# `normalize/entidades.normalizar_organismo` + `normalize/aplicar.run`) siempre normaliza
# mayúsculas/acentos/espacios para AGRUPAR y muestra un nombre legible con tildes correctas.
organismos:
  # true (default): una subunidad se agrupa en su jurisdicción madre (el ministerio/organismo
  # padre) para Analítica, filtros y rankings — la subunidad sigue viéndose como detalle en la
  # licitación puntual (`procesos.organismo`, sin tocar). false: cada subunidad queda en su propio
  # balde (sigue normalizada, no se duplica por mayúsculas/acentos/SAF, pero no sube al padre).
  # Es independiente de `organismos_sucesion` (cambios de nombre confirmados con prensa, ver
  # `organismos_historia.py`): esto nunca agrupa organismos RENOMBRADOS entre sí.
  agrupar_subunidades: true

# Impuestos en los precios (MEJORAS #42, jdemonasterio 2026-10-12): si cada canal/fuente informa el
# precio CON o SIN IVA. Solo documental — NO cambia ningún cálculo: el IVA es el mismo para todos los
# productos y proveedores de este catálogo, así que no hace falta ajustar nada, alcanza con saberlo
# (ver DESIGN_sobreprecios.md). Promociones: se toman como el precio vigente tal cual viene de la
# fuente. Stock y compra mínima: no se consideran (decisión explícita, no es un pendiente).
impuestos:
  incluye_iva:
    mayorista: true    # SEPA / Precios Claros / scrapers: precio de góndola al público, con IVA
    minorista: true    # idem
    programa: true      # Precios Cuidados/Justos/Máximos: precio techo al público, con IVA
    oficial: true        # INDEC (precio promedio al consumidor): con IVA
    estado: true          # lo que paga el Estado (dictamen/adjudicación/OC): consumidor final, con IVA

# Montos comparables entre años (normalize/moneda.py): pesos reales y dólares. Solo cambia cómo se MUESTRAN
# y suman montos de fechas distintas en el webui; el semáforo no cambia.
moneda:
  ipc: ipc_general                 # deflactor de "pesos reales" (IPC nivel general INDEC)
  base_mes: null                   # null = último mes con IPC publicado; o "2026-08-01"
  serie_usd: usd_contadoconliqui   # usd_contadoconliqui | usd_oficial | usd_mayorista | usd_blue | usd_bolsa
  casas: [oficial, mayorista, blue, bolsa, contadoconliqui]
  desde: "2016-01-01"

indices:
  # apis.datos.gob.ar/series — IPC base dic 2016, mensual.
  ipc_alimentos: 146.3_IALIMENNAL_DICI_M_45
  ipc_general: 148.3_INIVELNAL_DICI_M_26
