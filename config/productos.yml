# Catálogo canónico: la unidad de comparación "peras con peras".
#
# Un renglón de licitación y una observación de mercado se comparan SOLO si caen
# en el mismo producto. Todo se lleva a precio por unidad_base (kg, l o u).
#
# Reglas (sobre el texto normalizado: minúsculas, sin tildes, sin puntuación):
#   incluye: alguna frase cuyas palabras estén TODAS presentes (en cualquier orden)
#   excluye: si aparece CUALQUIERA de estas frases, no es este producto
# Si dos productos empatan, nadie gana: decide el LLM (o queda para revisión).
#
# busqueda: términos para buscar el producto en supermercados y mayoristas (relevamiento diario).
# variantes: sub-tipos que no se comparan entre sí (fideos largos vs cortos, leche fortificada vs común).
#   Si la licitación dice la variante y el mercado la tiene, se compara solo contra esa. Si no se puede
#   verificar, se compara contra el producto entero pero SIN rojo (juez externo 2026-10-11).
# indec.serie: serie mensual de precio promedio al consumidor (apis.datos.gob.ar).
# indec.presentacion: contenido al que corresponde ese precio.
# indec.verificado: oficial (dice la presentación en el nombre de la serie) |
#   inferido (deducido del nivel de precios vs mayoristas 2021) | desconocido (no se usa).

# Frases que descartan CUALQUIER producto (alimento para mascotas, juguetes, etc.).
# Encontrado en el golden de precios 2026-10-11: el "mínimo" de atún era comida para gatos.
exclusiones_globales: [gato, gatos, perro, perros, mascota, mascotas, whiskas, pedigree, "cat chow", "dog chow",
                       felino, canino, juguete, sticker, llavero,
                       # platos preparados (archivo SEPA: "SC BIFE CRIOLL ARROZ" caía como arroz)
                       bife, crioll, criollo, milanesa, milanesas, empanada, empanadas, tarta, tartas, ensalada,
                       sandwich, hamburguesa, hamburguesas, "listo para", rotiseria, vianda,
                       medallon, medallones]   # juez 2026-10-11: "Medallones de Quinoa NUTREE Lentejas" caía como lentejas

productos:

  # ── Alimentos secos ──────────────────────────────────────────────────────
  leche_polvo_entera:
    nombre: Leche en polvo entera
    rubro: alimentos
    unidad_base: kg
    busqueda: ["leche en polvo entera"]
    tamano_referencia: 800 g
    incluye: ["leche polvo"]
    excluye: [descremada, maternizada, infantil, formula, deslactosada, "sin lactosa",
              chocolatada, cacao, modificada, "parcialmente", queso, coco, almendras, bebe, meses,
              nutrilon, profutura, nutribaby, etapa, vegetal]
    indec: {serie: 105.1_I2LPE_2016_M_27, presentacion: 800 g, verificado: inferido}
    # El Estado suele pedir leche fortificada (Ley 25.459): se compara con fortificada si el mercado la tiene.
    variantes:
      fortificada: [fortificada, hierro, zinc, vitamina, "cal nut", calcio]
    variante_default: comun

