    variantes:
      concentrado_por_verificar:
      - concentrado
      - ultra
    motivo: Excluir el detergente para ropa abreviado. Separar lavavajillas concentrados de comunes y validar concentración/dosis;
      'ultra' no define un porcentaje uniforme. El detergente aniónico de concentración declarada 100 % necesita
      revisión de ficha y uso antes de compararse con lavavajillas doméstico.
    variante_default: null
    curado_por_claude: 'lo especial y más caro no fija el mínimo; atributo obligatorio (concentración / uso): sin
      dato en la compra = gris aunque sea ficha SIByS (prime P22 + juez casos)'
    atributo_obligatorio: true
