    motivo: Excluir aguas saborizadas sin esa palabra y abreviaturas de bidón. Separar mineral de mesa. Para bidones
      que solo indican volumen, aplicar enrutamiento por capacidad y envase, no agregar exclusiones numéricas indiscriminadas.
      La licitación de 12 botellas de 500 ml no debe tomar el mínimo de un botellón de 6–8 litros.
  agua_bidon:
    variantes:
      retornable:
      - retornable
      no_retornable:
      - no retornable
      - descartable
    variante_default: no_retornable
    motivo: Separar retornabilidad, dando prioridad a 'no retornable', y exigir coincidencia adicional de capacidad
      normalizada. El bidón retornable de 20 l licitado no es comparable con descartables de 6–8 l ni con 12 l.
      No inferir retornabilidad solo por capacidad. Confirmar también que se venda agua y no un envase vacío.
    decision_jdemonasterio: '2026-10-12: default "no_retornable" (bidón/botellón/botella que se vende y no
      vuelve): si la descripción no dice retornable, se asume no retornable.'
  lavandina:
    excluye_extra:
    - granulada
    - antisplash
    - anti splash
    - multisup
    - multis
    variantes:
      comun:
