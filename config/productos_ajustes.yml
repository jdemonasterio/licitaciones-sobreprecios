_nota: 'Ajustes propuestos por el LLM prime (gpt-6-astra) el 2026-10-11 tras revisar ejemplos reales de macheo,
  curados por Claude (campo curado_por_claude). Se suman a config/productos.yml (excluye/incluye)
  y sus variantes reemplazan a las del catálogo (`variantes: {}` explícito las BORRA, no las deja igual al base).
  Borrar una entrada la desactiva. Ojo: las frases se buscan como bolsa de palabras, no como texto seguido.
  2026-10-12 (jdemonasterio): decisiones del owner que PISAN las del LLM prime donde difieren — quedan documentadas
  por producto en el campo `decision_jdemonasterio`. Agrega `nota_equivalencia` (variante -> texto que compare.run()
  suma al motivo cuando esa variante se usó) y reafirma que `compatibles` puede mapear una variante de la compra a la
  variante "comun"/default del mercado para productos que no exigen variante no vendida al público (leche fortificada
  Ley 25.459 vs leche común).'
productos:
  leche_polvo_entera:
    excluye_extra:
    - desc
    - descr
    - des move
    - deslac
    - zero lactosa
    - lactosa
    variantes:
      fortificada_hierro_zinc_c:
      - hierro zinc y acido ascorbico
      - hierro zinc y vitamina c
      - vitamina c hierro y zinc
      fortificada_cal_nut:
      - cal nut
      fortificada_a_d:
      - vitaminas a y d
      fortificada_sin_detalle:
      - fortificada
      - hierro
      - zinc
      - vitamina
      - calcio
    motivo: 'Las abreviaturas dejan pasar leche descremada o deslactosada. Además, no alcanza con que dos leches
      sean ''fortificadas'': Cal-Nut o vitaminas A y D no acreditan la composición exigida de hierro, zinc y vitamina
      C. Dar prioridad a la composición específica y no comparar fortificación sin detalle contra la exigida por
      ley.'
    variante_default: comun
    compatibles:
      fortificada_hierro_zinc_c: [comun]
      fortificada_cal_nut: [comun]
      fortificada_a_d: [comun]
      fortificada_sin_detalle: [comun]
    nota_equivalencia:
      fortificada_hierro_zinc_c: 'leche fortificada (Ley 25.459) comparada con leche en polvo comun: no se vende
        al publico; se infiere un precio muy similar'
      fortificada_cal_nut: 'leche fortificada (Ley 25.459) comparada con leche en polvo comun: no se vende al
        publico; se infiere un precio muy similar'
      fortificada_a_d: 'leche fortificada (Ley 25.459) comparada con leche en polvo comun: no se vende al publico;
        se infiere un precio muy similar'
      fortificada_sin_detalle: 'leche fortificada (Ley 25.459) comparada con leche en polvo comun: no se vende al
        publico; se infiere un precio muy similar'
    curado_por_claude: 'lo especial y más caro no fija el mínimo; sin_detalle también con hierro/zinc/vitamina/calcio
      sueltos: una mención parcial no cae en ''comun''; + ''lactosa'' (juez muestra final: leche 0% lactosa)'
    decision_jdemonasterio: '2026-10-12: default "comun" restituido (el LLM prime lo había puesto en null). "Es
      leche en polvo entera y punto": sin mención de fortificación, se asume la común. Las compras de leche
      FORTIFICADA (Ley 25.459: hierro, zinc y vitamina C/acido ascorbico) no se venden al publico, así que se
      comparan contra la leche en polvo COMUN de góndola via `compatibles` (mecanismo genérico, no hardcodeado
      a este producto) con una advertencia visible en el motivo via `nota_equivalencia`. Semáforo normal (no se
      relaja ni se endurece).'
  leche_entera_fluida:
    excluye_extra:
    - formula lactea
    - baby
    - desc
    - descr
    - p descr
    variantes:
