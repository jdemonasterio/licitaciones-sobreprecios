      refrigerada: la licitación exige larga vida. No deducir el proceso solamente de ''sachet'', ''carton'' o ''entera''.'
    curado_por_claude: '+ ''descr'' (juez casos: ''LECHE UAT P DESCR FORT'' entraba como entera)'
