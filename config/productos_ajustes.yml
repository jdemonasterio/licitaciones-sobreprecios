      - clasica
      concentrada_por_verificar:
      - concentrada
      - concent
      - doble rendimiento
      - dobl rendimiento
      ultra_por_verificar:
      - ultra
    motivo: Excluir producto sólido, antisalpicaduras y limpiadores multisuperficie del comparador de lavandina
      líquida común. Separar concentraciones; las etiquetas comerciales solo preclasifican y no acreditan gramos
      de cloro activo por litro. No convertir granulada de 40 g a litros ni equiparar 'doble rendimiento' con común.
    variante_default: null
    curado_por_claude: 'lo especial y más caro no fija el mínimo; quitado ''cif'' (objeción del prime P22: no excluir
      por marca); atributo obligatorio (cloro activo): sin dato en la compra = gris aunque sea ficha SIByS (prime
      P22 + juez casos)'
    atributo_obligatorio: true
  detergente:
    excluye_extra:
