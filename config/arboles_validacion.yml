    opciones:
    - respuesta: Sí
      ir_a: v
      resultado: null
    - respuesta: La compra es otro producto
      ir_a: null
      resultado: corregir campo producto
    - respuesta: La referencia es otro producto
      ir_a: null
      resultado: marcar referencia como no equivalente
    - respuesta: No se confirma
      ir_a: null
      resultado: gris por producto no confirmado
  - id: v
    pregunta: ¿Cumple las características expresamente pedidas?
    ayuda: No hay subvariantes configuradas. Si se exige uso en máquina, baja espuma o una concentración determinada,
      verificarlo; compartir la denominación jabón en polvo no acredita requisitos adicionales.
    opciones:
    - respuesta: Sí, o no hay requisitos adicionales
      ir_a: e
      resultado: null
    - respuesta: La referencia incumple
      ir_a: null
      resultado: marcar referencia como no equivalente
    - respuesta: Falta evidencia
      ir_a: null
      resultado: gris por requisito no verificado
  - id: e
    pregunta: ¿Se conocen los kilos y se cumple el envase pedido?
    ayuda: 800 g son 0,8 kg. No comparar precio de bolsa con precio por kg sin convertir. Sin presentación exigida,
      admitir otros tamaños conocidos y tomar el mínimo.
    opciones:
    - respuesta: Sí
      ir_a: null
      resultado: comparable por producto; completar instrucciones, parseo y mínimo
    - respuesta: La referencia incumple la presentación
      ir_a: null
      resultado: marcar referencia como no equivalente
    - respuesta: Contenido desconocido
      ir_a: null
      resultado: gris por contenido desconocido
- id: producto_jabon_tocador
  titulo: Jabón de tocador
  aplica_a: jabon_tocador
  inicio: p
  nodos:
  - id: p
    pregunta: ¿Es jabón de tocador en barra?
    ayuda: Excluir líquido y polvo. El caso ARTÍCULOS DE TOCADOR; JABÓN DE TOCADOR; BARRA X 90 GR identifica el
      producto, pero no el peso de una caja completa.
    opciones:
    - respuesta: Sí
      ir_a: v
      resultado: null
    - respuesta: La compra es otro producto
      ir_a: null
      resultado: corregir campo producto
    - respuesta: La referencia es otro producto
      ir_a: null
      resultado: marcar referencia como no equivalente
    - respuesta: No se confirma
      ir_a: null
      resultado: gris por producto no confirmado
  - id: v
    pregunta: ¿Coincide la formulación del jabón?
    ayuda: El dueño restableció default estándar. Registrar infantil, antibacterial y glicerina cuando están declarados;
      pueden coexistir. No usar el default para borrar una formulación explícita.
    opciones:
    - respuesta: Sí, estándar declarado o por default en ambos
      ir_a: e
      resultado: null
    - respuesta: Sí, atributos especiales coincidentes
      ir_a: e
      resultado: null
    - respuesta: Las formulaciones difieren
      ir_a: null
      resultado: marcar referencia como no equivalente
    - respuesta: Hay información contradictoria
      ir_a: null
      resultado: gris por formulación ambigua
  - id: e
    pregunta: ¿Se distinguieron barra, paquete y caja?
    ayuda: 572 pesos por barra de 90 g se divide por 0,09 kg. Una caja necesita número de barras y gramos por barra.
      El formato comercial no excluye si no está exigido; si la compra exige barras de 90 g, verificar ese contenido.
    opciones:
    - respuesta: Sí, contenido conocido y requisitos cumplidos
      ir_a: null
      resultado: comparable por producto; completar instrucciones, parseo y mínimo
    - respuesta: La referencia incumple una presentación expresamente exigida
      ir_a: null
      resultado: marcar referencia como no equivalente
    - respuesta: No se conoce el contenido de la unidad pagada
      ir_a: null
      resultado: gris por contenido o unidad desconocidos
- id: producto_resma_a4
  titulo: Papel A4 por hoja
  aplica_a: resma_a4
  inicio: p
  nodos:
  - id: p
    pregunta: ¿Es papel blanco A4 para impresión o fotocopia?
    ayuda: Excluir oficio, carta, A3, fotográfico, color, cartulina, autoadhesivo y papel madera. Resma no prueba
      por sí sola el tamaño A4.
    opciones:
    - respuesta: Sí
      ir_a: v
      resultado: null
    - respuesta: La compra es otro papel
      ir_a: null
      resultado: corregir campo producto
    - respuesta: La referencia es otro papel
      ir_a: null
      resultado: marcar referencia como no equivalente
    - respuesta: No se confirma tamaño o tipo
      ir_a: null
      resultado: gris por producto no confirmado
  - id: v
    pregunta: ¿Cumple gramaje y demás requisitos escritos?
    ayuda: No hay subvariantes configuradas, pero una exigencia de gramaje o certificación debe verificarse. A4
      indica tamaño de hoja, no gramos por metro cuadrado ni cantidad de hojas.
    opciones:
    - respuesta: Sí, o no hay requisitos adicionales
      ir_a: e
      resultado: null
    - respuesta: La referencia incumple
      ir_a: null
      resultado: marcar referencia como no equivalente
    - respuesta: Falta evidencia
      ir_a: null
      resultado: gris por requisito no verificado
  - id: e
    pregunta: ¿Se conoce cuántas hojas cubre el precio?
    ayuda: La unidad base es una hoja, no una resma. Dividir por 500 solo si se confirman 500 hojas; para una caja,
      multiplicar resmas por hojas. Sin presentación exigida, tomar el mínimo por hoja entre formatos conocidos.
    opciones:
    - respuesta: Sí, y se cumple la presentación exigida
      ir_a: null
      resultado: comparable por producto; completar instrucciones, parseo y mínimo
    - respuesta: Se usó resma como unidad base
      ir_a: null
      resultado: 'corregir campo unidad base y precio normalizado: pesos por hoja'
    - respuesta: La referencia incumple la presentación exigida
      ir_a: null
      resultado: marcar referencia como no equivalente
    - respuesta: Falta cantidad de hojas
      ir_a: null
      resultado: gris por contenido desconocido
- id: validar_minimo
  titulo: Validar cada referencia y el mínimo de mercado
  aplica_a: minimo
  inicio: m1
  nodos:
  - id: m1
    pregunta: ¿El precio tiene una fuente identificable?
    ayuda: Revisar cada observación candidata, no solo la más barata. Guardar ID, cadena, fecha, enlace o archivo
      y contenido original. No presentar como observado un precio reconstruido o sugerido por un modelo.
    opciones:
    - respuesta: Es un precio real documentado
      ir_a: m2
      resultado: null
    - respuesta: Es un precio de programa oficial
      ir_a: mp
      resultado: null
    - respuesta: Es un promedio INDEC, precio estimado o inferido
      ir_a: mi
      resultado: null
    - respuesta: No hay respaldo verificable
      ir_a: null
      resultado: gris por referencia sin respaldo; excluir del mínimo hasta aclarar
  - id: m2
    pregunta: ¿La pantalla reproduce correctamente la fuente?
    ayuda: Comparar precio, unidad, producto, variedad, envase, fecha y marca. Si una caja se leyó como una unidad,
      marcar mal leído. Un precio realmente bajo no es por sí solo una mala lectura.
    opciones:
    - respuesta: Sí
      ir_a: m3
      resultado: null
    - respuesta: No, hay un error comprobable
      ir_a: null
      resultado: marcar referencia como mal leído; corregir los campos afectados y volver a validar
    - respuesta: La fuente no permite decidir
      ir_a: null
      resultado: gris por lectura no verificable
  - id: m3
    pregunta: ¿Pasa el árbol de producto y las instrucciones?
    ayuda: Comprobar mismo producto, variedad según decisiones del dueño, marca cuando corresponda y envase si fue
      exigido. Un alimento para gatos nunca fija el mínimo de atún. Sin envase exigido, admitir presentaciones conocidas
      y normalizar.
    opciones:
    - respuesta: Sí
      ir_a: m4
      resultado: null
    - respuesta: Es otro producto o incumple una exigencia
      ir_a: null
      resultado: marcar referencia como no equivalente; recalcular sin ella
    - respuesta: Falta un atributo necesario
      ir_a: null
      resultado: gris por equivalencia no verificable; no usar como mínimo válido
  - id: m4
    pregunta: ¿El precio es del día de compra o de los 15 días anteriores?
    ayuda: No usar precios posteriores ni extender la ventana con IPC. Las referencias a 488, 1.157 o 1.812 días
      de los ejemplos no sirven. Conservar fecha original y ajuste al mes de compra por IPC.
    opciones:
    - respuesta: Sí, fecha comprobada
      ir_a: m5
      resultado: null
    - respuesta: La fecha fue mal copiada
      ir_a: null
      resultado: marcar referencia como mal leído; corregir campo fecha
    - respuesta: Está fuera de ventana
      ir_a: null
      resultado: descartar de este mínimo por fecha; gris por sin datos si no queda otra referencia admisible
    - respuesta: Falta fecha de compra o de observación
      ir_a: null
      resultado: gris por fecha desconocida
  - id: m5
    pregunta: ¿Unidad, contenido e impuestos tienen una base común?
    ayuda: Comparar pesos/kg, pesos/l o pesos/hoja, según producto. Confirmar si ambos precios incluyen impuestos;
      no asumirlo por tratarse del mismo producto. No convertir ml a kg sin respaldo ni mezclar neto y escurrido.
    opciones:
    - respuesta: Sí, cálculo e impuestos verificados
      ir_a: m6
      resultado: null
    - respuesta: Hay un error de lectura o conversión
      ir_a: null
      resultado: marcar referencia como mal leído cuando corresponda; corregir campo precio normalizado o impuestos
    - respuesta: Falta contenido, peso comparable o tratamiento impositivo
      ir_a: null
      resultado: gris por base de precio desconocida
  - id: m6
    pregunta: ¿Hay una anomalía sin resolver?
    ayuda: 'Revisar precios absurdos con la fuente: decimal, bulto, fecha o producto. La cuarentena nueva está en
      backlog; no inventar un filtro obligatorio ni una regla de mediana. Si ya existe una retención de la observación,
      revisar su motivo antes de rehabilitarla.'
    opciones:
    - respuesta: No, o la anomalía fue aclarada con evidencia
      ir_a: m7
      resultado: null
    - respuesta: Se confirma otro producto
      ir_a: null
      resultado: marcar referencia como no equivalente
    - respuesta: Se confirma mala lectura
      ir_a: null
      resultado: marcar referencia como mal leído; corregir y recalcular
    - respuesta: Sigue siendo sospechosa sin explicación
      ir_a: null
      resultado: gris por referencia sospechosa pendiente; no confirmar mínimo ni rojo con ella
  - id: m7
    pregunta: ¿Es el menor precio de todas las referencias admisibles?
    ayuda: Marcar equivalente solo tras confirmar el producto. Elegir el mínimo normalizado, no promedio ni mediana.
      Por decisión del dueño no filtrar por geografía, promoción, stock o compra mínima; sí leer correctamente qué
      precio y cantidad se publicaron.
    opciones:
    - respuesta: Sí; IDs y exclusiones quedan registrados
      ir_a: m8
      resultado: null
    - respuesta: Hay otra referencia admisible más barata
      ir_a: null
      resultado: corregir campo referencia mínima; guardar todos los IDs y recalcular
    - respuesta: No queda ningún precio real admisible
      ir_a: mp
      resultado: null
  - id: m8
    pregunta: ¿El mínimo usado para rojo está corroborado por dos cadenas?
    ayuda: Dos sucursales, dos capturas o dos sitios de la misma cadena no son dos cadenas. Guardar todos los IDs
      del par y de la ventana. Si los precios difieren, documentar la referencia efectiva y la regla de corroboración;
      no declarar confirmado el menor por tener cualquier segundo precio.
    opciones:
    - respuesta: Sí, dos cadenas independientes y corroboración verificable
      ir_a: m9
      resultado: null
    - respuesta: Solo hay una cadena o no hay corroboración suficiente
      ir_a: ma
      resultado: null
    - respuesta: No se explica cómo se obtuvo la referencia efectiva
      ir_a: null
      resultado: gris por mínimo confirmado no verificable; conservar solo la condición de mínimo observado si está
        validado
  - id: m9
    pregunta: ¿La razón de precios supera 4 veces?
    ayuda: Usar los precios comparables ya normalizados. En aceite, agua y detergente aparecen razones de 25,1,
      12,6 y 4,8 antes de revisar. Mayor que 4 activa revisar unidad aunque ambos valores parezcan bien leídos.
    opciones:
    - respuesta: Sí
      ir_a: null
      resultado: gris por revisar unidad; nunca rojo; verificar compra y referencia
    - respuesta: 'No'
      ir_a: mr
      resultado: null
  - id: mr
    pregunta: ¿La brecha sigue en 20% o más con dos meses de plazo?
    ayuda: Verificar factor compuesto, IPC y referencia efectiva del par, no una confianza heredada de otra referencia.
      Rojo requiere además parseo e instrucciones válidos y ausencia de monto_inconsistente. Una brecha no prueba
      irregularidad.
    opciones:
    - respuesta: Sí, y se cumplen todas las condiciones
      ir_a: null
      resultado: comparable; mínimo corroborado; candidato a rojo sujeto a revisión humana y advertencias
    - respuesta: No alcanza 20% con dos meses
      ir_a: ma
      resultado: null
    - respuesta: Hay monto inconsistente o un ajuste sin verificar
      ir_a: null
      resultado: gris por monto o ajuste no verificado; bloquear rojo y solicitar revisión
  - id: ma
    pregunta: ¿La brecha llega a 8% con un mes de plazo?
    ayuda: Amarillo puede basarse en mínimo observado de una cadena, pero no en una referencia incompatible. Verificar
      factor compuesto. La regla de mayor que 4 veces y los bloqueos de datos tienen prioridad.
    opciones:
    - respuesta: La razón supera 4 veces
      ir_a: null
      resultado: gris por revisar unidad; nunca rojo
    - respuesta: Sí, con datos válidos
      ir_a: null
      resultado: comparable; amarillo contra mínimo observado; no afirmar mínimo confirmado sin par válido
    - respuesta: 'No'
      ir_a: null
      resultado: comparable; sin señal por los umbrales informados
    - respuesta: No se puede verificar el cálculo
      ir_a: null
      resultado: gris por ajuste o base de cálculo desconocidos
  - id: mp
    pregunta: ¿Corresponde usar un precio de programa como último recurso?
    ayuda: Verificar que no haya precios reales de mercado utilizables en la fecha y ventana admitidas, y documentar
      la búsqueda. Precios Cuidados/Justos/Máximos son pisos pactados, no mínimos reales. Deben acreditar vigencia,
      producto, marca cuando aplique, envase y unidad.
    opciones:
    - respuesta: Sí, ausencia de mercado documentada y programa válido
      ir_a: null
      resultado: referencia de programa revisable a mano; mostrar origen y advertencias; no presentarla como mínimo
        real ni habilitar rojo por sí sola
    - respuesta: Existe una referencia real admisible
      ir_a: null
      resultado: 'corregir campo fuente de referencia: priorizar mercado real'
    - respuesta: El programa no coincide o no estaba vigente
      ir_a: null
      resultado: descartar de este mínimo; gris por sin referencia válida
    - respuesta: No se puede verificar
      ir_a: null
      resultado: gris por precio de programa no verificable
  - id: mi
    pregunta: ¿Qué parte del precio o presentación fue inferida?
    ayuda: INDEC es promedio mensual, no mínimo. Presentación oficial puede permitir normalizar; presentación inferida
      necesita corroboración, y desconocida no se usa. Leche en polvo 800 g y azúcar 1 kg figuran como inferidas;
      la serie de dulce de leche figura desconocida.
    opciones:
    - respuesta: Es promedio INDEC con presentación verificable
      ir_a: null
      resultado: referencia contextual, no mínimo de mercado; nunca rojo por INDEC solo; conservar fuente y advertencia
    - respuesta: La presentación inferida se confirmó con documentación
      ir_a: null
      resultado: corregir campo evidencia de presentación; sigue siendo promedio si proviene de INDEC, no mínimo
        observado
    - respuesta: Contenido o precio siguen siendo una estimación sin respaldo
      ir_a: null
      resultado: gris por precio o presentación inferidos; no usar como mínimo confirmado
    - respuesta: La presentación INDEC es desconocida
      ir_a: null
      resultado: no usar la serie para comparar; gris por contenido desconocido si es la única referencia
- id: validar_parseo
  titulo: Validar cantidades, unidades y montos
  aplica_a: parseo
  inicio: p1
  nodos:
  - id: p1
    pregunta: ¿El formulario corresponde al renglón y proveedor correctos?
    ayuda: 'Usar el documento que acredita la decisión: no mezclar presupuesto, oferta alternativa, dictamen, contrato
      y pago. Guardar IDs y estado documental. Si dos alternativas adjudicadas empatan en precio, elegir al menos
      una según la decisión del dueño, conservando las alternativas y la advertencia.'
    opciones:
    - respuesta: Sí, renglón y estado documental identificados
      ir_a: p2
      resultado: null
    - respuesta: Hay empate, pero la adjudicación está acreditada
      ir_a: pt
      resultado: null
    - respuesta: Se mezclaron documentos, proveedor o renglón
      ir_a: null
      resultado: corregir campo renglón, proveedor y estado documental
    - respuesta: No se acredita adjudicación o el documento falta
      ir_a: null
      resultado: gris por estado documental no verificado; no afirmar precio pagado
  - id: pt
    pregunta: ¿El empate afecta producto, envase o monto?
    ayuda: Elegir una alternativa no autoriza inventar su contenido. Guardar los IDs de todas las alternativas empatadas
      y una regla de selección reproducible. Si ofrecen envases distintos, el precio coincidente no resuelve la
      unidad.
    opciones:
    - respuesta: No; las alternativas son iguales para esta comparación
      ir_a: p2
      resultado: null
    - respuesta: Sí, y el documento permite identificar la correcta
      ir_a: null
      resultado: corregir campo alternativa seleccionada; guardar IDs y volver a validar
    - respuesta: Sí, pero no se puede resolver
      ir_a: null
      resultado: gris por alternativa adjudicada ambigua para normalizar; conservar adjudicación acreditada
  - id: p2
    pregunta: ¿Fecha, moneda y números están bien leídos?
    ayuda: 1,8 kg significa 1,8, no 18; 385.7176 puede usar punto decimal según la fuente. No corregir separadores
      por intuición. Registrar fecha pertinente a la compra y distinguir pesos nominales de pesos reales o dólares.
    opciones:
    - respuesta: Sí
      ir_a: p3
      resultado: null
    - respuesta: Hay un error comprobable
      ir_a: null
      resultado: corregir campo fecha, moneda o valor numérico afectado
    - respuesta: Falta fecha o moneda
      ir_a: null
      resultado: gris por fecha o moneda desconocidas
  - id: p3
    pregunta: ¿El importe es unitario o total?
    ayuda: Leer encabezados y notas. Precio unitario por unidad no significa automáticamente precio por kg. Si el
      importe cubre varios renglones o servicios, no repartirlo por partes iguales.
    opciones:
    - respuesta: Es precio unitario del renglón
      ir_a: p4
      resultado: null
    - respuesta: Es total de este renglón
      ir_a: pq
      resultado: null
    - respuesta: Es total conjunto de varios productos o servicios
      ir_a: pc
      resultado: null
    - respuesta: No se puede determinar
      ir_a: null
      resultado: gris por alcance del importe desconocido
  - id: pc
    pregunta: ¿Existe un desglose documental del monto conjunto?
    ayuda: Buscar anexos, oferta, dictamen y contrato. No deducir el precio del alimento de un total que también
      incluye envases, equipos o servicios sin importes separables.
    opciones:
    - respuesta: Sí, permite recuperar precio o total del renglón
      ir_a: null
      resultado: corregir campo importe del renglón con el desglose y reiniciar parseo
    - respuesta: 'No'
      ir_a: null
      resultado: gris por monto conjunto no separable; sugerir revisión humana con todos los documentos relevantes
  - id: pq
    pregunta: ¿Se conoce la cantidad a la que corresponde ese total?
    ayuda: Precio unitario = total del renglón dividido por cantidad de unidades compradas, siempre que ambos cubran
      lo mismo. No dividir un total de cajas por cantidad de botellas ni un monto con cargos distintos sin conciliarlos.
    opciones:
    - respuesta: Sí, cantidad y alcance coinciden
      ir_a: p4
      resultado: null
    - respuesta: La cantidad se leyó mal
      ir_a: null
      resultado: corregir campo cantidad
    - respuesta: No se conoce la cantidad
      ir_a: null
      resultado: gris por sin precio unitario calculable; solicitar completar cantidad
  - id: p4
    pregunta: ¿Qué se compra por cada unidad pagada?
    ayuda: Distinguir kilogramo, litro, hoja, envase, paquete, caja y bulto. En leche en polvo comprada por kilogramos
      no volver a dividir por el peso de un envase. En 12 envases de 500 ml comprobar si se paga botella o paquete.
    opciones:
    - respuesta: Ya es kg, litro o hoja de la unidad base correcta
      ir_a: p7
      resultado: null
    - respuesta: Es envase, paquete, caja o bulto identificado
      ir_a: p5
      resultado: null
    - respuesta: Unidad está mal cargada
      ir_a: null
      resultado: corregir campo unidad de compra
    - respuesta: Solo dice unidad y no se puede resolver
      ir_a: null
      resultado: gris por unidad de compra desconocida
  - id: p5
    pregunta: ¿Se conocen contenido y cantidad interna?
    ayuda: 'Contenido total = unidades internas por contenido de cada una. 12 × 500 ml = 6 l. No multiplicar menciones
      repetidas: ENVASE 320 GR, PESO 320 GR sigue siendo 320 g. Caja de transporte no implica que el precio sea
      por caja.'
    opciones:
    - respuesta: Sí
      ir_a: p6
      resultado: null
    - respuesta: Se duplicó contenido o se omitió un multiplicador
      ir_a: null
      resultado: corregir campo contenido del envase y unidades internas
    - respuesta: Falta un dato
      ir_a: null
      resultado: gris por contenido desconocido; no usar tamaño de referencia como supuesto
  - id: p6
    pregunta: ¿La conversión a unidad base es correcta?
    ayuda: Gramos/1.000 = kg; ml/1.000 = l. Precio por unidad base = precio de la unidad pagada dividido por contenido
      base de esa unidad. Resma A4 se divide por hojas. En conservas usar igual criterio de peso; ml no son kg automáticamente.
    opciones:
    - respuesta: Sí
      ir_a: p7
      resultado: null
    - respuesta: Hay un error de cálculo
      ir_a: null
      resultado: corregir campo precio normalizado
    - respuesta: Falta densidad, peso comparable u otro dato indispensable
      ir_a: null
      resultado: gris por conversión no verificable
  - id: p7
    pregunta: ¿Impuestos y cargos están identificados?
    ayuda: Verificar precio final frente a precio sin impuestos. Aunque la alícuota legal sea igual, una publicación
      puede mostrar otra base. Separar cargos solo con respaldo; no inventar flete, depósito o bonificación.
    opciones:
    - respuesta: Sí, base comparable o ajuste documentado
      ir_a: p8
      resultado: null
    - respuesta: Hay campos o cálculos erróneos
      ir_a: null
      resultado: corregir campo impuestos y cargos
    - respuesta: No se conoce la base del precio
      ir_a: null
      resultado: gris por impuestos o cargos no verificables
  - id: p8
    pregunta: ¿Cantidad, precio unitario y total son consistentes?
    ayuda: Comprobar cantidad × precio unitario contra el total del mismo alcance, explicando redondeos y cargos
      documentados. No inventar una tolerancia. Cantidad desconocida no impide por sí sola comparar un precio unitario
      válido.
    opciones:
    - respuesta: Sí, o la diferencia está conciliada documentalmente
      ir_a: p9
      resultado: null
    - respuesta: Falta cantidad, pero el precio unitario está acreditado
      ir_a: null
      resultado: comparable por precio unitario si supera las otras validaciones; exceso_ars = null; sugerir completar
        cantidad
    - respuesta: Los montos se contradicen
      ir_a: null
      resultado: gris por monto_inconsistente; bloquear rojo; solicitar revisión con toda la información relevante
    - respuesta: Hay un error de transcripción identificado
      ir_a: null
      resultado: corregir campo cantidad, precio unitario o total según la fuente
  - id: p9
    pregunta: ¿El exceso total se calcula con cantidades compatibles?
    ayuda: Si la diferencia está en pesos/kg, multiplicar por kg totales, no por número de envases. No llamar pagado
      a un monto solo adjudicado. Pesos reales y dólares CCL sirven para agregación posterior, con fecha y factor
      conservados, no para mezclar bases en la brecha.
    opciones:
    - respuesta: Sí
      ir_a: null
      resultado: parseo validado; continuar instrucciones, producto y mínimo; guardar cálculo e IDs de origen
    - respuesta: Se mezclaron envases con kg/l/hojas o monedas
      ir_a: null
      resultado: corregir campo cantidad base, exceso_ars o conversión monetaria
    - respuesta: Falta cantidad total verificable
      ir_a: null
      resultado: exceso_ars = null; sugerir revisión humana para completar cantidad
- id: validar_instrucciones
  titulo: Leer el pliego y aplicar las reglas de revisión
  aplica_a: instrucciones
  inicio: i1
  nodos:
  - id: i1
    pregunta: ¿Se reunieron los documentos necesarios?
    ayuda: Leer renglón, pliego, anexos, aclaraciones, oferta y acto de adjudicación disponible. Separar exigido,
      ofrecido y adjudicado. Las decisiones explícitas del dueño mandan sobre defaults o separaciones anteriores;
      no completar partes truncadas del material recibido.
    opciones:
    - respuesta: Sí
      ir_a: i2
      resultado: null
    - respuesta: Falta un documento que puede cambiar producto o precio
      ir_a: null
      resultado: gris por documentación insuficiente; solicitar revisión humana
    - respuesta: Se confundió dictamen, contrato o pago
      ir_a: null
      resultado: corregir campo estado_documental y textos del caso
  - id: i2
    pregunta: ¿El renglón es el producto completo y no un ingrediente?
    ayuda: 'Antes de buscar coincidencias, descartar mascotas, juguetes y preparados. Medallones de Quinoa NUTREE
      Lentejas y SC BIFE CRIOLL ARROZ no son legumbres o arroz secos. Leer negaciones localmente: sin palo con menta
      no contiene una afirmación con palo.'
    opciones:
    - respuesta: Sí, producto identificado sin conflicto
      ir_a: i3
      resultado: null
    - respuesta: La compra fue clasificada por un ingrediente
      ir_a: null
      resultado: corregir campo producto
    - respuesta: La referencia fue clasificada por un ingrediente
      ir_a: null
      resultado: marcar referencia como no equivalente
    - respuesta: Hay empate entre productos o descripción ambigua
      ir_a: null
      resultado: gris por producto ambiguo; revisión humana o juez LLM con evidencia
  - id: i3
    pregunta: ¿La marca está exigida, es orientativa o solo fue ofrecida?
    ayuda: Guardar por separado marca exigida, ofrecida y adjudicada. Una marca ofrecida no se vuelve exigencia
      del pliego. Marca X o equivalente abre la revisión de equivalencia; no autoriza aceptar cualquier producto.
    opciones:
    - respuesta: Marca obligatoria sin equivalentes
      ir_a: im
      resultado: null
    - respuesta: Marca seguida de o equivalente
      ir_a: ieq
      resultado: null
    - respuesta: No hay marca exigida; quizá solo ofrecida o adjudicada
      ir_a: i4
      resultado: null
    - respuesta: La cláusula no es clara
      ir_a: null
      resultado: gris por alcance de marca desconocido
  - id: im
    pregunta: ¿La referencia corresponde a la marca obligatoria?
    ayuda: Con marca estrictamente exigida, la búsqueda del mínimo queda dentro de esa marca y de los demás requisitos.
      No sustituirla porque otra sea más barata; comprobar también la línea o formulación.
    opciones:
    - respuesta: Sí
      ir_a: i4
      resultado: null
    - respuesta: 'No'
      ir_a: null
      resultado: marcar referencia como no equivalente
    - respuesta: No hay mercado verificable de esa marca
      ir_a: null
      resultado: gris por sin referencia de marca exigida
  - id: ieq
    pregunta: ¿La otra marca acredita la equivalencia pedida?
    ayuda: Comparar especificaciones que usa el pliego para o equivalente. No basta misma unidad kg/l ni una afirmación
      del vendedor. Guardar ficha, criterio y decisión del revisor.
    opciones:
    - respuesta: Sí, o es la misma marca y cumple las especificaciones
      ir_a: i4
      resultado: null
    - respuesta: No cumple
      ir_a: null
      resultado: marcar referencia como no equivalente
    - respuesta: No se puede verificar
      ir_a: null
      resultado: gris por equivalencia de marca no acreditada
  - id: i4
    pregunta: ¿Qué variedad y requisitos técnicos están escritos?
    ayuda: 'Aplicar el árbol del producto. Respetar defaults del dueño: leche en polvo común, cacao azucarado, pan
      dulce frutado, dulce de leche en pote, agua en bidón no retornable y jabón estándar, entre otros. Registrar
      default frente a dato explícito; no convertir un default en evidencia técnica.'
    opciones:
    - respuesta: Están cargados y la referencia cumple el árbol del producto
      ir_a: i5
      resultado: null
    - respuesta: Se omitió o inventó un atributo
      ir_a: null
      resultado: corregir campo variedad o requisitos técnicos
    - respuesta: La referencia incumple
      ir_a: null
      resultado: marcar referencia como no equivalente
    - respuesta: Falta un atributo crítico y no existe default autorizado
      ir_a: null
      resultado: gris por atributo desconocido; no comparar con otra variedad
  - id: i5
    pregunta: ¿El pliego exige tamaño, material o forma de envase?
    ayuda: Aceite ENVASE X 5 L, PET; atún SOBRE, 120 GR; y jabón BARRA X 90 GR son exigencias explícitas. Tamano_referencia
      del catálogo no lo es. Distinguir envase primario de caja de transporte.
    opciones:
    - respuesta: Sí, y la referencia cumple cada requisito aplicable
      ir_a: i6
      resultado: null
    - respuesta: Sí, pero la referencia incumple
      ir_a: null
      resultado: marcar referencia como no equivalente
    - respuesta: 'No exige presentación: admitir la mínima normalizada con contenido conocido'
      ir_a: i6
      resultado: null
    - respuesta: No se puede determinar la exigencia o verificarla
      ir_a: null
      resultado: gris por presentación exigida no verificable
  - id: i6
    pregunta: ¿La entrega o los servicios cambian lo que cubre el precio?
    ayuda: Registrar entregas parciales, logística especial, depósitos o servicios incluidos que puedan explicar
      la brecha. El dueño descartó filtros por geografía, promociones, stock y compra mínima. No inventar recargos
      ni descontar servicios sin desglose.
    opciones:
    - respuesta: No cambian el alcance, o solo requieren una advertencia explicativa
      ir_a: i7
      resultado: null
    - respuesta: Hay cargos separados y documentados
      ir_a: i7
      resultado: null
    - respuesta: El precio mezcla productos o servicios inseparables
      ir_a: null
      resultado: gris por monto conjunto no separable; revisar parseo
    - respuesta: Se aplicó un filtro prohibido por geografía, promo, stock o compra mínima
      ir_a: null
      resultado: corregir selección de referencias; recalcular sin ese filtro
  - id: i7
    pregunta: ¿Se registraron los plazos y la base impositiva?
    ayuda: 'Conservar el plazo contractual y las condiciones de pago como explicación, sin reemplazar silenciosamente
      los escenarios del comparador: un mes para amarillo y dos para rojo, con factor compuesto. Verificar impuestos
      incluidos o no; no deducirlo del proveedor.'
    opciones:
    - respuesta: Sí, y los cálculos usan una base verificable
      ir_a: i8
      resultado: null
    - respuesta: El plazo contractual no aparece, pero se documentan los escenarios estándar
      ir_a: i8
      resultado: null
    - respuesta: Se mezclaron bases o se calculó mal el plazo
      ir_a: null
      resultado: corregir campo impuestos, plazo o factor de ajuste
    - respuesta: No se puede verificar la base impositiva o el ajuste necesario
      ir_a: null
      resultado: gris por base impositiva o ajuste no verificable
  - id: i8
    pregunta: ¿La decisión y sus límites quedan visibles?
    ayuda: Equivalente significa mismo producto conforme a estas reglas; no asegura fecha ni precio correcto. No
      es el mismo producto corresponde a incompatibilidad comprobada; mal leído a transcripción errónea. La incertidumbre
      deja el caso pendiente/gris, sin forzar una etiqueta falsa.
    opciones:
    - respuesta: Sí; evidencia, IDs, defaults y motivos están guardados
      ir_a: i9
      resultado: null
    - respuesta: Faltan pruebas, IDs o motivos
      ir_a: null
      resultado: corregir campos de evidencia y trazabilidad antes de cerrar la revisión
  - id: i9
    pregunta: ¿El revisor entiende qué puede comunicar?
    ayuda: Una brecha no prueba irregularidad. Mostrar estado documental, supuestos, referencias de programa o inferidas,
      faltantes y explicaciones posibles. El humano decide publicable; no imponer un bloqueo automático de exportación,
      pero no ocultar advertencias ni llamar pagado a lo solo adjudicado.
    opciones:
    - respuesta: Sí; decide publicar con advertencias claras
      ir_a: null
      resultado: instrucciones validadas; registrar decisión humana de publicación y advertencias; conservar semáforo
        técnico sin alterarlo
    - respuesta: Prefiere completar información
      ir_a: null
      resultado: mantener en revisión; sugerir campos y documentos faltantes
    - respuesta: El texto afirma irregularidad o pago sin respaldo
      ir_a: null
      resultado: corregir campo texto del caso y estado documental
