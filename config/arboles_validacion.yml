      resultado: gris por variedad desconocida
  - id: e
    pregunta: ¿Se conocen los litros y se cumple el envase pedido?
    ayuda: Una caja de 12 unidades de 1 litro contiene 12 litros si el precio es por caja. Sin presentación exigida,
      elegir el mínimo normalizado entre envases conocidos; no exigir sachet solo porque lo releva INDEC.
    opciones:
    - respuesta: Sí
      ir_a: null
      resultado: comparable por producto; completar instrucciones, parseo y mínimo
    - respuesta: El mercado incumple el envase exigido
      ir_a: null
      resultado: marcar referencia como no equivalente
    - respuesta: Falta contenido o alcance del precio
      ir_a: null
      resultado: gris por contenido o unidad desconocidos
