_nota: 'Árboles de decisión para validar casos paso a paso (revisores humanos y juez LLM). Generados por el LLM
  prime (gpt-6-astra) el 2026-10-12 a pedido de jdemonasterio (P23), con sus decisiones de catálogo como regla;
  nodo de leche ajustado a la decisión del mismo día (fortificada vs común con aviso). PENDIENTE DE CHECK. Cada
  árbol: inicio -> nodos con pregunta/ayuda -> opciones que llevan a otro nodo (ir_a) o a un resultado.'
arboles:
- id: producto_leche_polvo_entera
  titulo: Leche en polvo entera
  aplica_a: leche_polvo_entera
  inicio: p
  nodos:
  - id: p
    pregunta: ¿Es leche en polvo entera?
    ayuda: 'No alcanza con que diga leche: descremada, fórmula infantil, vegetal y sin lactosa quedan fuera. Ejemplo
      válido: leche entera en polvo instantánea fortificada.'
    opciones:
    - respuesta: Sí
      ir_a: v
      resultado: null
    - respuesta: La compra es otro producto
      ir_a: null
      resultado: corregir campo producto
    - respuesta: La referencia es otro producto
      ir_a: null
      resultado: marcar referencia como no equivalente
    - respuesta: No se puede confirmar
      ir_a: null
      resultado: gris por producto no confirmado
  - id: v
    pregunta: ¿Qué fortificación declara?
    ayuda: Por decisión del dueño, sin mención de fortificación se carga común. Si dice hierro, zinc y ácido ascórbico,
      registrar esos nutrientes. Cal-Nut por sí solo no acredita esa composición; A/D y hierro/zinc/C pueden coexistir.
    opciones:
    - respuesta: 'No menciona fortificación: cargar común'
      ir_a: c
      resultado: null
    - respuesta: 'Declara nutrientes o una formulación identificada: cargarlos'
      ir_a: c
      resultado: null
    - respuesta: Solo dice fortificada o da información parcial
      ir_a: null
      resultado: gris por fortificación incompleta; completar campo variedad
  - id: c
    pregunta: ¿La referencia es leche en polvo ENTERA comparable?
    ayuda: 'Decisión del dueño (2026-10-12): la leche fortificada por Ley 25.459 no se vende al público; se compara
      con leche en polvo entera común y el sistema muestra un aviso. No sirve una referencia descremada, deslactosada,
      fórmula infantil o saborizada.'
    opciones:
    - respuesta: Sí, es leche en polvo entera (común o fortificada)
      ir_a: e
      resultado: null
    - respuesta: 'No: descremada, sin lactosa, fórmula u otro producto'
      ir_a: null
      resultado: marcar referencia como no equivalente
    - respuesta: No se puede saber por la descripción
      ir_a: null
      resultado: gris por referencia no verificable
  - id: e
    pregunta: ¿Contenido y presentación permiten comparar?
    ayuda: La compra de 575 pesos por unidad no permite calcular pesos/kg sin gramos por unidad. La compra de 385,7176
      pesos por kilogramo ya tiene unidad base. No usar 800 g de referencia como contenido supuesto. Exigir el envase
      solo si lo pide la compra.
    opciones:
    - respuesta: Contenido conocido y presentación exigida cumplida, o no exigida
      ir_a: null
      resultado: comparable por producto; completar validaciones de instrucciones, parseo y mínimo
    - respuesta: La referencia incumple la presentación exigida
      ir_a: null
      resultado: marcar referencia como no equivalente
    - respuesta: Falta contenido o no se sabe qué unidad se pagó
      ir_a: null
      resultado: gris por contenido o unidad desconocidos; corregir campo envase
