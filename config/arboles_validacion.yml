    - respuesta: No se sabe
      ir_a: null
      resultado: gris por producto no confirmado
  - id: v
    pregunta: ¿Coincide el proceso de la leche?
    ayuda: Distinguir larga vida/UAT de ultrapasteurizada refrigerada. Sachet, cartón o entera no prueban el proceso.
      Registrar larga_vida o ultrapasteurizada según la documentación.
    opciones:
    - respuesta: Sí, proceso identificado y coincidente
      ir_a: e
      resultado: null
    - respuesta: Son procesos distintos
      ir_a: null
      resultado: marcar referencia como no equivalente
    - respuesta: Alguno no informa el proceso
